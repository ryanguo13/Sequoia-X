[project]
name = "sequoia-x"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.10",
    "baostock>=0.9",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pandas>=2.0",
    "PyGithub>=2.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-mock>=3.12",
]

# ─────────────────────────────────────────────────────────
# setuptools: 显式指定 package 发现，避免 data/ 等目录被当成 top-level package
# 修复 GH Actions 上 uv pip install 报错：
#   "Multiple top-level packages discovered in a flat-layout: ['data', 'sequoia_x']"
# ─────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["sequoia_x*"]
exclude = ["data*", "docs*", "tests*", "scripts*", "realtime_dashboard*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["sequoia_x/notify/site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"sequoia_x/notify/site_renderer.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
